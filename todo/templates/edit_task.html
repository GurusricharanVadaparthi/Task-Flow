{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | TaskFlow</title>
    <link rel="stylesheet" href="{% static 'css/edit.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="{{ profile.theme }}">

{% include 'navbar.html' %}

<div class="edit-container">
    <div class="edit-card">
        <h1>Edit Task</h1>
        <p>Update your task details below.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Task Name</label>
                <input type="text" name="task_name" value="{{ task.task_name }}" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4">{{ task.description|default:'' }}</textarea>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select name="priority">
                    <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
                    <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
                </select>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}">
            </div>
            <div class="button-group">
                <button type="submit" class="save-btn">Save Changes</button>
                <a href="{% url 'dashboard' %}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="{% static 'js/todo.js' %}"></script>
</body>
</html>
